<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet"/>


    <!-- icon page-->
    <link rel="icon" type="image/png" href="images/google.png">

    <link rel="stylesheet" href="fonts/icomoon/style.css"/>

    <link rel="stylesheet" href="css/owl.carousel.min.css" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <!-- Style -->
    <link rel="stylesheet" href="css/style.css" />

     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <title>Login</title>
  </head>
  <body>
  <div class="content">
    <div class="container login-container">
            <!-- Gambar kiri -->
      <div class="image-box">
        <img src="images/smart-farming-iot-agriculture.webp" alt="Ilustrasi Pertanian" />
      </div>
      <!-- Form kanan -->
      <div class="form-box">
        <div class="mb-4">
          <h3>Masuk ke Sistem <strong>ATPH</strong></h3>
          <p class="mb-4 text-muted">
            Silakan login untuk mengakses layanan pertanian terpadu kami.
          </p>
        </div>
        <form action="#" method="post">
          <div class="form-group first">
            <label for="email">Alamat Email</label>
            <input type="text" class="form-control" id="email" />
          </div>
          <div class="form-group last mb-4">
            <label for="password">Kata Sandi</label>
            <input type="password" class="form-control" id="password" />
          </div>

          <input type="submit" value="Masuk" class="btn text-black btn-block btn-success" style="background-color: #008374" />

          <div class="d-flex mb-5 align-items-center mt-3 justify-content-between">
            <a href="#" class="forgot-pass">Belum Punya Akun?</a>
            <a href="#" class="forgot-pass">Lupa Kata Sandi?</a>
          </div>
        </form>
      </div>

    </div>
  </div>


<style>
  .login-container {
    display: flex;
    flex-wrap: wrap;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }

  .form-box {
    flex: 1 1 400px;
    padding: 30px;
    max-width: 500px;
  }

  .image-box {
    flex: 1 1 400px;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    border: 5px solid #008374;
    border-radius: 20px;
    overflow: hidden;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 768px) {
    .login-container {
      flex-direction: column;
    }

    .image-box, .form-box {
      max-width: 90%;
    }

    .image-box {
      margin-top: 20px;
      aspect-ratio: 1 / 1;
    }
  }
</style>


    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
